services:
  api1:
    platform: linux/amd64
    image: starwhenry/rinha-backend-2026:2605140444
    environment:
      LISTEN_ADDR: '/run/sock/api1.sock'
      GOMAXPROCS: '1'
      GOMEMLIMIT: '150MiB'
      N_PROBE_FAST: '8'
      N_PROBE_FULL: '28'
    volumes:
      - sock:/run/sock
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: '0.38'
          memory: '165M'

  api2:
    platform: linux/amd64
    image: starwhenry/rinha-backend-2026:2605140444
    environment:
      LISTEN_ADDR: '/run/sock/api2.sock'
      GOMAXPROCS: '1'
      GOMEMLIMIT: '150MiB'
      N_PROBE_FAST: '8'
      N_PROBE_FULL: '28'
    volumes:
      - sock:/run/sock
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: '0.38'
          memory: '165M'

  proxy:
    image: nginx:alpine-slim
    command: ['nginx', '-c', '/etc/nginx/nginx.conf']
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - sock:/run/sock
    ports:
      - '9999:9999'
    networks:
      - rinha
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: '0.24'
          memory: '20M'

volumes:
  sock:

networks:
  rinha:
    driver: bridge
