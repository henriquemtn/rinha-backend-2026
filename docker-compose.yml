services:
  api1:
    image: starwhenry/rinha-backend-2026:latest
    container_name: api1
    environment:
      REFERENCES_PATH: /app/resources/references.json.gz
      LISTEN_ADDR: /run/sock/api1.sock
      GOMAXPROCS: "1"
      GOMEMLIMIT: "150MiB"
    volumes:
      - sock:/run/sock
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "150M"

  api2:
    image: starwhenry/rinha-backend-2026:latest
    container_name: api2
    environment:
      REFERENCES_PATH: /app/resources/references.json.gz
      LISTEN_ADDR: /run/sock/api2.sock
      GOMAXPROCS: "1"
      GOMEMLIMIT: "150MiB"
    volumes:
      - sock:/run/sock
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "150M"

  nginx:
    image: nginx:1.27-alpine
    container_name: lb
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - sock:/run/sock
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "50M"

volumes:
  sock:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,uid=0,gid=0,mode=0777
