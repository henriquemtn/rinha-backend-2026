version: "3.9"

services:
  api1:
    image: starwhenry/rinha-backend-2026:latest
    container_name: api1
    environment:
      REFERENCES_PATH: /app/resources/references.json.gz
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "150M"

  api2:
    image: starwhenry/rinha-backend-2026:latest
    container_name: api2
    environment:
      REFERENCES_PATH: /app/resources/references.json.gz
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "150M"

  nginx:
    image: nginx:1.27-alpine
    container_name: lb
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "50M"
